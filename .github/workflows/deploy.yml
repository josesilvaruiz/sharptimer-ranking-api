name: Deploy Ranking API
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Copy files to server
        run: |
          scp -i ~/.ssh/id_ed25519 ranking_api.py k8s/ranking-api.yaml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/
      - name: Apply manifest and roll out
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            kubectl apply -f /tmp/ranking-api.yaml
            kubectl create configmap ranking-api-script \
              --from-file=ranking_api.py=/tmp/ranking_api.py \
              -n ranking-api --dry-run=client -o yaml | kubectl apply -f -
            rm -f /tmp/ranking_api.py /tmp/ranking-api.yaml
            kubectl -n ranking-api rollout restart deployment/ranking-api
            kubectl -n ranking-api rollout status deployment/ranking-api --timeout=90s
          '
